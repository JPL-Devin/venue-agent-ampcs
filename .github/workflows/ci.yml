name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Generate test RSA keypair
        run: |
          openssl genrsa -out exec_venue_private_pem.pem 2048
          openssl rsa -in exec_venue_private_pem.pem -pubout -out exec_venue_public_pem.pem

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

      - name: Run mocked integration tests
        env:
          ING_VENUE_DIR: /tmp/venue
          ING_MTAK_DIR: /tmp/mtak
          ING_LOG_DIR: /tmp/logs
          CUSTOM_SCRIPT_BASE_DIR: /tmp/scripts
          LAD_HOST: localhost
          LAD_PORT: "8887"
          LAD_HTTPS: "false"
          CHILL_GDS: /tmp/chill
          BUS_1553_LOGFILE_PATH: ""
          LOGFILE_1553_DICTIONARY_FILE_PATH: ""
          IRIG_SOURCE: "false"
        run: pytest tests/integration/ -v --tb=short

      - name: Run all non-live tests with coverage
        env:
          ING_VENUE_DIR: /tmp/venue
          ING_MTAK_DIR: /tmp/mtak
          ING_LOG_DIR: /tmp/logs
          CUSTOM_SCRIPT_BASE_DIR: /tmp/scripts
          LAD_HOST: localhost
          LAD_PORT: "8887"
          LAD_HTTPS: "false"
          CHILL_GDS: /tmp/chill
          BUS_1553_LOGFILE_PATH: ""
          LOGFILE_1553_DICTIONARY_FILE_PATH: ""
          IRIG_SOURCE: "false"
        run: pytest tests/unit/ tests/integration/ --cov=core --cov=. --cov-report=term-missing -v
