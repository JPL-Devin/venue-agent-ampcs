[metadata]
name = venue-agent-ampcs
version = 14.1.0

[options]
python_requires = >=3.6
py_modules =
    main
    utils
packages = find:
install_requires =
    fastapi>=0.60,<0.64
    uvicorn>=0.13,<0.15
    pydantic>=1.8,<2.0
    redis>=3.5,<5.0
    tailer>=0.4
    psutil>=5.0,<6.0
    bitstring>=3.0,<4.0
    pyaml-env>=1.0,<2.0
    PyYAML>=5.0,<7.0
    PyJWT>=2.0,<3.0
    cryptography>=3.0,<36.0
    requests>=2.25,<3.0
    file-read-backwards>=2.0,<4.0
    python-dateutil>=2.8,<3.0

[options.packages.find]
include = core*

[options.extras_require]
dev =
    pytest>=6.0,<7.0
    pytest-cov>=3.0,<4.0
